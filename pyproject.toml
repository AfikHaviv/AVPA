[project]
name = "cve-exploit-llm-pipeline"
version = "0.1.0"
description = "Educational pipeline: fetch a CVE, use an open-source Hugging Face LLM to generate and explain a PoC exploit, and demonstrate it against an isolated lab target."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
    "huggingface-hub>=0.24.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "pymetasploit3>=1.0.6",
]

[project.scripts]
cve-pipeline = "cve_pipeline.cli:main"
cve-pipeline-live = "cve_pipeline.live_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cve_pipeline"]
